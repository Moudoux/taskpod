name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Skip commits whose message starts with [nobuild]
    if: ${{ !startsWith(github.event.head_commit.message, '[nobuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: PKGBUILD version matches Cargo.toml
        run: |
          cargo_version=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          pkgbuild_version=$(sed -n 's/^pkgver=//p' dist/arch/PKGBUILD)
          if [ "$cargo_version" != "$pkgbuild_version" ]; then
            echo "::error file=dist/arch/PKGBUILD::pkgver $pkgbuild_version doesn't match Cargo.toml $cargo_version"
            exit 1
          fi

  vscode:
    if: ${{ !startsWith(github.event.head_commit.message, '[nobuild]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: taskpod-vscode
          path: editors/vscode/*.vsix

  build:
    needs: check
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: taskpod
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: taskpod.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: taskpod-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv taskpod-x86_64-unknown-linux-gnu/taskpod taskpod-linux-x86_64
          mv taskpod-x86_64-pc-windows-msvc/taskpod.exe taskpod-windows-x86_64.exe
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes \
            taskpod-linux-x86_64 taskpod-windows-x86_64.exe taskpod-vscode/*.vsix
