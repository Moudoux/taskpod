[package]
name = "taskpod"
version = "0.17.0"
edition = "2024"
rust-version = "1.85"
description = "Declarative task runner: tasks declare dependencies and run in parallel"
license = "MIT"
repository = "https://github.com/Moudoux/taskpod"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
inquire = "0.9.4"
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "3.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1
