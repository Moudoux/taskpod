[package]
name = "taskpod"
version = "0.21.1"
edition = "2024"
rust-version = "1.89"
description = "Declarative task runner: tasks declare dependencies and run in parallel"
license = "MIT"
repository = "https://github.com/Moudoux/taskpod"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
console = "0.16.6"
indicatif = "0.18.6"
inquire = "0.9.4"
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled", "serialize"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sha2 = "0.10.9"
similar = "3.2.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
strip = true
codegen-units = 1

# `cargo deb` (cargo-deb) builds the Debian package into target/debian/.
[package.metadata.deb]
maintainer = "Moudoux <14980525+Moudoux@users.noreply.github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
suggests = "sudo, openssh-client, sops, age"
extended-description = """\
Task files (.task) declare tasks with dependencies. Tasks run in parallel, \
and if/unless checks make them idempotent. It can configure the local machine \
or another one over SSH, and undo what it changed."""
assets = [
  ["target/release/taskpod", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/taskpod/", "644"],
  ["spec.task", "usr/share/doc/taskpod/", "644"],
  ["Task.xml", "usr/share/taskpod/", "644"],
]
